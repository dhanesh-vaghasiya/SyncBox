services:
  db:
    image: postgres:15
    container_name: syncbox-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-9265944501}
      POSTGRES_DB: ${DB_NAME:-syncbox}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: syncbox-app
    ports:
      - "8080:8080"
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://db:5432/${DB_NAME:-syncbox}}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-9265944501}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-b2}
      B2_KEY_ID: ${B2_KEY_ID:-}
      B2_APPLICATION_KEY: ${B2_APPLICATION_KEY:-}
      B2_BUCKET_NAME: ${B2_BUCKET_NAME:-}
      B2_ENDPOINT: ${B2_ENDPOINT:-https://s3.us-west-004.backblazeb2.com}
      B2_REGION: ${B2_REGION:-us-west-004}
    depends_on:
      - db
    volumes:
      - app_uploads:/app/uploads

volumes:
  postgres_data:
  app_uploads: