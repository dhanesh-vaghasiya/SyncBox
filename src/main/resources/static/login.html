<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SyncBox - Login</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; padding-top: 100px; color: #333; }
        .container { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; }
        h2 { text-align: center; color: #4CAF50; margin-top: 0; }
        input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; background: #4CAF50; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-size: 16px; transition: background 0.3s; }
        button:hover { background: #45a049; }
        .error { color: #f44336; margin-bottom: 15px; font-size: 14px; text-align: center; }
        .link { text-align: center; margin-top: 15px; font-size: 14px; }
        .link a { color: #2196F3; text-decoration: none; }
        .link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Login</h2>
        <div id="errorMsg" class="error"></div>
        <form action="/login" method="post">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <div class="link">
            Don't have an account? <a href="/signup.html">Sign Up</a>
        </div>
    </div>
    <script>
        if (window.location.search.includes('error')) {
            document.getElementById('errorMsg').innerText = 'Invalid username or password.';
        }
        if (window.location.search.includes('logout')) {
            document.getElementById('errorMsg').innerText = 'You have been logged out.';
            document.getElementById('errorMsg').style.color = '#4CAF50';
        }
    </script>
</body>
</html>
