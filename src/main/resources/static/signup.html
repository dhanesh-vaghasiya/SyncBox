<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyncBox - Sign Up</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body style="margin: 0;">
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h2>
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width: 28px; height: 28px;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    SyncBox
                </h2>
                <p>Create an account to start syncing files.</p>
            </div>
            
            <div id="alertMsg" class="auth-alert"></div>
            
            <form class="auth-form" id="signupForm">
                <div class="auth-input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" class="auth-input" placeholder="Enter username" required>
                    <div id="usernameErr" class="auth-error-text">Username must be at least 3 characters and alphanumeric.</div>
                </div>
                
                <div class="auth-input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="auth-input" placeholder="Create a strong password" required>
                    <div id="passwordErr" class="auth-error-text">Password must be at least 8 characters long, contain an uppercase letter, a lowercase letter, and a number.</div>
                </div>

                <div class="auth-input-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" class="auth-input" placeholder="Re-enter your password" required>
                    <div id="confirmPasswordErr" class="auth-error-text">Passwords do not match.</div>
                </div>
                
                <button type="submit" class="auth-btn">Sign Up</button>
            </form>
            
            <div class="auth-footer">
                Already have an account? <a href="/login.html">Sign in</a>
            </div>
        </div>
    </div>
    
    <script>
        const signupForm = document.getElementById('signupForm');
        const alertMsg = document.getElementById('alertMsg');

        // Regex patterns
        const usernameRegex = /^[a-zA-Z0-9]{3,}$/;
        const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/;

        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const confirmPasswordInput = document.getElementById('confirmPassword');
            
            const usernameErr = document.getElementById('usernameErr');
            const passwordErr = document.getElementById('passwordErr');
            const confirmPasswordErr = document.getElementById('confirmPasswordErr');

            // Reset errors
            [usernameInput, passwordInput, confirmPasswordInput].forEach(el => el.classList.remove('error'));
            [usernameErr, passwordErr, confirmPasswordErr].forEach(el => el.style.display = 'none');
            alertMsg.style.display = 'none';

            let isValid = true;

            // Validate Username
            if (!usernameRegex.test(usernameInput.value)) {
                usernameInput.classList.add('error');
                usernameErr.style.display = 'block';
                isValid = false;
            }

            // Validate Password
            if (!passwordRegex.test(passwordInput.value)) {
                passwordInput.classList.add('error');
                passwordErr.style.display = 'block';
                isValid = false;
            }

            // Validate Confirm Password
            if (passwordInput.value !== confirmPasswordInput.value) {
                confirmPasswordInput.classList.add('error');
                confirmPasswordErr.style.display = 'block';
                isValid = false;
            }

            if (!isValid) return;

            try {
                const response = await fetch('/api/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `username=${encodeURIComponent(usernameInput.value)}&password=${encodeURIComponent(passwordInput.value)}`
                });
                
                const text = await response.text();
                if (response.ok) {
                    alertMsg.className = 'auth-alert success';
                    alertMsg.innerText = "Account created successfully! Redirecting to login...";
                    setTimeout(() => window.location.href = '/login.html', 2000);
                } else {
                    alertMsg.className = 'auth-alert error';
                    alertMsg.innerText = text;
                }
            } catch (err) {
                alertMsg.className = 'auth-alert error';
                alertMsg.innerText = 'Network error occurred. Please try again.';
            }
        });
    </script>
</body>
</html>
