spring.application.name=SyncBox

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/syncbox}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:9265944501}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB

# ==========================================
# Cloud Storage Configuration (Backblaze B2)
# ==========================================
# Storage Provider: "b2" (Backblaze B2 Cloud Storage) or "local" (Local Disk Storage)
storage.provider=${STORAGE_PROVIDER:b2}

# Backblaze B2 Credentials (S3-Compatible API)
storage.b2.key-id=${B2_KEY_ID:}
storage.b2.application-key=${B2_APPLICATION_KEY:}
storage.b2.bucket-name=${B2_BUCKET_NAME:}
storage.b2.endpoint=${B2_ENDPOINT:https://s3.us-west-004.backblazeb2.com}
storage.b2.region=${B2_REGION:us-west-004}

# Local Staging Directory (used for temporary chunk assembly & fallback)
storage.local.upload-dir=${STORAGE_LOCAL_DIR:./uploads/}